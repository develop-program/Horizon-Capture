  <script src="https://unpkg.com/aos@2.3.1/dist/aos.js"></script>
  <script src="js/main.js"></script>
  <script>
    const filterBtns = document.querySelectorAll('.filter-btn');
    const items = document.querySelectorAll('.gallery-item');

    filterBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        filterBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        const filter = btn.dataset.filter;
        items.forEach(item => {
          if (filter === 'all' || item.dataset.category === filter) {
            item.style.display = 'block';
          } else {
            item.style.display = 'none';
          }
        });
      });
    });

    const lightbox = document.getElementById('lightbox');
    const lightboxContent = document.getElementById('lightboxContent');
    const closeBtn = document.getElementById('closeLightbox');
    const prevBtn = document.getElementById('prevBtn');
    const nextBtn = document.getElementById('nextBtn');
    
    let currentItems = [];
    let currentIndex = 0;

    function updateLightbox() {
      const item = currentItems[currentIndex];
      if (!item) return;

      if (item.src) {
        lightboxContent.innerHTML = `<img src="${item.src}" style="max-width:100%; max-height:80vh; object-fit:contain; border-radius:8px;">`;
      } else {
        lightboxContent.innerHTML = `<div class="placeholder-img" style="width:100%; height:60vh; border-radius:16px; font-size:2rem;">${item.text}</div>`;
      }
    }

    items.forEach((item) => {
      item.addEventListener('click', (e) => {
        if (item.getAttribute('onclick')) return;
        e.preventDefault();
        
        if (item.dataset.images) {
          const imageUrls = JSON.parse(item.dataset.images);
          currentItems = imageUrls.map(url => ({ src: url }));
          currentIndex = 0;
        } else {
          const allSingleItems = Array.from(document.querySelectorAll('.gallery-item'))
            .filter(i => i.style.display !== 'none' && !i.dataset.images && !i.getAttribute('onclick'))
            .map(i => {
              const img = i.querySelector('img');
              const text = i.querySelector('.item-overlay span').textContent;
              return { src: img ? img.src : null, text: text };
            });
          
          currentItems = allSingleItems;
          const clickedImg = item.querySelector('img')?.src;
          const clickedText = item.querySelector('.item-overlay span').textContent;
          currentIndex = currentItems.findIndex(i => 
            (clickedImg && i.src === clickedImg) || (!clickedImg && i.text === clickedText)
          );
          if (currentIndex === -1) currentIndex = 0;
        }

        updateLightbox();
        lightbox.classList.add('active');
      });
    });

    closeBtn.addEventListener('click', () => lightbox.classList.remove('active'));
    prevBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentItems.length <= 1) return;
      currentIndex = (currentIndex - 1 + currentItems.length) % currentItems.length;
      updateLightbox();
    });
    nextBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      if (currentItems.length <= 1) return;
      currentIndex = (currentIndex + 1) % currentItems.length;
      updateLightbox();
    });

    document.addEventListener('keydown', (e) => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') lightbox.classList.remove('active');
      if (e.key === 'ArrowLeft') prevBtn.click();
      if (e.key === 'ArrowRight') nextBtn.click();
    });

    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) lightbox.classList.remove('active');
    });

    let touchStartX = 0;
    let touchEndX = 0;
    lightbox.addEventListener('touchstart', (e) => {
      touchStartX = e.changedTouches[0].screenX;
    }, { passive: true });
    lightbox.addEventListener('touchend', (e) => {
      touchEndX = e.changedTouches[0].screenX;
      if (currentItems.length <= 1) return;
      if (touchStartX - touchEndX > 50) nextBtn.click();
      else if (touchEndX - touchStartX > 50) prevBtn.click();
    }, { passive: true });
  </script>
